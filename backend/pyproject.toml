[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wedding-mix-maker"
version = "0.1.0"
description = "A local wedding music mix maker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "yt-dlp[default]>=2025.11.12",
    "sqlmodel>=0.0.24,<0.1",
    "python-multipart>=0.0.20,<1",
    "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in real YouTube download tests"]

